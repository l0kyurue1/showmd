name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # runs prepare, so client/dist/ exists before the pack guard and e2e tests
      - run: npm ci
      - run: npm test

  skill-eval-preflight:
    name: skill eval isolation / no model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global @openai/codex@0.147.0 @anthropic-ai/claude-code@2.1.228
      - run: SHOWMD_EVAL_PREFLIGHT_ONLY=1 ./test/skill-evals/showmd/runners/codex.sh 1 '' '^(01|17|18|19)$'
      - run: SHOWMD_EVAL_PREFLIGHT_ONLY=1 ./test/skill-evals/showmd/runners/claude.sh 1 '' '^(01|17|18|19)$'
